# Netlify builds the dashboard from this repository and publishes dist/.
# GitHub Actions does the harvesting every night and commits the results here,
# which makes Netlify rebuild the site automatically.
[build]
  command = "pip install -r requirements.txt && cd harvester && python build_baseline.py && python build_site.py"
  publish = "dist"

[build.environment]
  PYTHON_VERSION = "3.12"

[[headers]]
  for = "/data.json"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
