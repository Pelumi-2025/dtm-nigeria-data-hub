name: Harvest DTM Nigeria and publish the Data Hub

on:
  schedule:
    - cron: "30 1 * * *"      # every night at 02:30 WAT
  push:
    branches: [main]
    paths: ["data/raw/**", "data/reports/**", "harvester/**", "site/**"]
  workflow_dispatch:          # "Run workflow" button

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: harvest
  cancel-in-progress: true    # a new run replaces one that is still waiting or running

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt

      - name: Read the Excel files in data/raw
        run: cd harvester && python build_baseline.py

      - name: DTM public API (skipped if no DTM_API_KEY secret)
        continue-on-error: true
        env: { DTM_API_KEY: "${{ secrets.DTM_API_KEY }}" }
        run: cd harvester && python dtm_api.py

      - name: Crawl dtm.iom.int, ReliefWeb and HDX
        continue-on-error: true
        env: { RELIEFWEB_APPNAME: "${{ secrets.RELIEFWEB_APPNAME }}" }
        run: |
          cd harvester
          if [ "${{ github.event_name }}" = "push" ]; then
            python harvest_web.py --max-pages 3 --no-pdf    # after an upload: quick, so the site updates fast
          else
            python harvest_web.py                           # nightly / manual: every page + PDFs
          fi

      - name: Download Mobility Tracking data files published online
        continue-on-error: true
        run: cd harvester && python harvest_datasets.py

      - name: Save the harvest to the repository (kept even if a later step fails)
        if: always()
        run: |
          git config user.name "dtm-hub-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/harvest data/raw/online || true
          git diff --cached --quiet || git commit -m "Harvest $(date -u +%F\ %H:%M)"
          git pull --rebase --autostash || true
          git push || true

      - name: Re-read all data files (online first, attached files for missing rounds)
        continue-on-error: true
        run: cd harvester && python build_baseline.py

      - name: Build the dashboard
        run: cd harvester && python build_site.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
