name: Harvest DTM Nigeria and publish the Data Hub

on:
  schedule:
    - cron: "15 */6 * * *"    # quick check for new reports every 6 hours
    - cron: "30 1 * * *"      # full harvest with PDF reading every night (02:30 WAT)
  push:
    branches: [main]
    paths: ["data/raw/**", "data/reports/**", "harvester/**", "site/**"]
  workflow_dispatch:          # "Run workflow" button

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: harvest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt

      - name: Read the Excel files in data/raw
        run: cd harvester && python build_baseline.py

      - name: DTM public API (skipped if no DTM_API_KEY secret)
        env: { DTM_API_KEY: "${{ secrets.DTM_API_KEY }}" }
        run: cd harvester && python dtm_api.py

      - name: Crawl dtm.iom.int, ReliefWeb and HDX
        env: { RELIEFWEB_APPNAME: "${{ secrets.RELIEFWEB_APPNAME }}" }
        run: |
          cd harvester
          if [ "${{ github.event.schedule }}" = "15 */6 * * *" ]; then
            python harvest_web.py --max-pages 5 --no-pdf     # quick: first pages only
          else
            python harvest_web.py                            # full: every page + PDFs
          fi

      - name: Download Mobility Tracking data files published online
        run: cd harvester && python harvest_datasets.py

      - name: Re-read all data files (online first, attached files for missing rounds)
        run: cd harvester && python build_baseline.py

      - name: Build the dashboard
        run: cd harvester && python build_site.py

      - name: Save the harvest to the repository
        run: |
          git config user.name "dtm-hub-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/harvest data/baseline.json data/raw/online || true
          git diff --cached --quiet || git commit -m "Harvest $(date -u +%F\ %H:%M)"
          git pull --rebase --autostash || true
          git push || true

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
